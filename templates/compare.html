{% extends 'base.html' %}{% block title %}Compare pilots — {{event.title}}{% endblock %}{% block content %}<div class="eyebrow">{{event.title}}</div><h1>Compare pilots</h1><div class="card"><div class="controls"><label>Scoring <select id="mode"><option value="official">Official</option><option value="all">Include provisional</option></select></label><label>From <select id="from"><option value="">1</option>{% for n in range(1,tasks_max+1) %}<option>{{n}}</option>{% endfor %}</select></label><label>To <select id="to"><option value="">Latest</option>{% for n in range(1,tasks_max+1) %}<option>{{n}}</option>{% endfor %}</select></label></div><p class="muted">Select up to eight pilots.</p><div class="pilot-select">{% for p in pilots %}<label><input type="checkbox" value="{{p.competition_number}}" {% if p.competition_number|string in request.args.get('pilots','').split(',') %}checked{% endif %}> #{{p.competition_number}} — {{p.name}}</label>{% endfor %}</div></div><div class="card"><div class="chart-wrap tall"><canvas id="chart"></canvas></div></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script>const eid={{event.id|tojson}},boxes=[...document.querySelectorAll('.pilot-select input')],mode=document.getElementById('mode'),from=document.getElementById('from'),to=document.getElementById('to');let chart;boxes.forEach(b=>b.addEventListener('change',load));[mode,from,to].forEach(x=>x.addEventListener('change',load));async function load(){const nums=boxes.filter(b=>b.checked).map(b=>b.value).slice(0,8);if(!nums.length){if(chart)chart.destroy();return}const p=new URLSearchParams({pilots:nums.join(','),mode:mode.value});if(from.value)p.set('from',from.value);if(to.value)p.set('to',to.value);const d=await fetch(`/api/event/${eid}/compare?${p}`).then(r=>r.json());const labels=d.pilots[0].series.map(x=>'T'+x.task),ds=d.pilots.map(x=>({label:'#'+x.competition_number+' — '+x.name,data:x.series.map(y=>y.position),tension:.25}));if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,scales:{y:{reverse:true,ticks:{precision:0}},x:{title:{display:true,text:'Task'}}},plugins:{tooltip:{mode:'index',intersect:false},legend:{position:'bottom'}}}})}load();</script>{% endblock %}
