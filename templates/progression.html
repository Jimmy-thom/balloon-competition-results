<div>
    <div class="eyebrow">{{event.location}}</div>
    <h1>Ranking progression</h1>
    <p class="muted">{{event.title}} · Top eight pilots after each task</p>
  </div>
  <a class="button" href="/event/{{event.id}}">← Back to standings</a>
</div>

<div class="card">
  <div class="section-head">
    <div>
      <h2>Ranking progression</h2>
      <p class="muted">Lower position is better. Use the filters to change the scoring range.</p>
    </div>
    <div class="controls">
      <select id="mode">
        <option value="official">Official only</option>
        <option value="all">Include provisional</option>
      </select>
      <label>From
        <select id="from">
          <option value="">1</option>
          {% for n in range(2,tasks_max+1) %}
          <option>{{n}}</option>
          {% endfor %}
        </select>
      </label>
      <label>To
        <select id="to">
          <option value="">Latest</option>
          {% for n in range(1,tasks_max+1) %}
          <option>{{n}}</option>
          {% endfor %}
        </select>
      </label>
    </div>
  </div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const eid={{event.id|tojson}},
      mode=document.getElementById('mode'),
      from=document.getElementById('from'),
      to=document.getElementById('to');

let chart;

function qs(){
  let p=new URLSearchParams({mode:mode.value});
  if(from.value)p.set('from',from.value);
  if(to.value)p.set('to',to.value);
  return p;
}

async function load(){
  const d=await fetch(`/api/event/${eid}/progression?${qs()}`).then(r=>r.json());
  const labels=d.progression.map(x=>'T'+x.through_task);
  const top=d.progression.at(-1)?.rows.slice(0,8)||[];

  const ds=top.map(r=>({
    label:'#'+r.competition_number+' — '+r.pilot,
    data:d.progression.map(x=>x.rows.find(y=>y.competition_number===r.competition_number)?.position??null),
    tension:.25
  }));

  if(chart)chart.destroy();

  chart=new Chart(document.getElementById('chart'),{
    type:'line',
    data:{labels,datasets:ds},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      scales:{
        y:{reverse:true,ticks:{precision:0}},
        x:{title:{display:true,text:'Task'}}
      },
      plugins:{
        legend:{position:'bottom'},
        tooltip:{mode:'index',intersect:false}
      }
    }
  });
}

[mode,from,to].forEach(x=>x.addEventListener('change',load));
load();
</script>
{% endblock %}
